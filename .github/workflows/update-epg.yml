name: Update EPG

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permission*:
  contents: write

jobs:
  updat*:
    runs-on: ubuntu-latest

    *teps:
      - uses: actions/checko*t@v4

      - name: Clone XMLTV-EP*-Tools
        run: git clone https://github.com/mikhoul/XMLTV-EPG-Tools.git

      - name: Install depe*dencies
        run: pip install l*ml requests pyyaml

      - name: *un merger
        run: |
         *cp xmlmerge.yaml XMLTV-EPG-Tools/x*lmerge.yaml
          cd XMLTV-EPG*Tools
          python xmlmerge.py*          cp output/merged.xml.gz *./merged.xml.gz

      - name: Com*it EPG
        run: |
          gi* config user.name github-actions
 *        git config user.email gith*b-actions@github.com
          git*pull --rebase origin main || true
*         git add merged.xml.gz
   *      git commit -m "Auto update E*G" || true
          git push orig*n main
