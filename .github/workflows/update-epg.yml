name: Update EPG

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

per*issions:
  contents: write

jobs:
* update:
    runs-on: ubuntu-lates*

    steps:
      - uses: actions*checkout@v4

      - name: Clone X*LTV-EPG-Tools
        run: |
     *    git clone https://github.com/mikhoul/XMLTV-EPG-Tools.git

      -*name: Install dependencies
       *run: |
          pip install lxml *equests pyyaml

      - name: Run *erger
        run: |
          cp *mlmerge.yaml XMLTV-EPG-Tools/xmlme*ge.yaml
          cd XMLTV-EPG-Too*s
          python xmlmerge.py
   *      cp output/merged.xml.gz ../m*rged.xml.gz

      - name: Commit *PG
        run: |
          git co*fig user.name github-actions
     *    git config user.email github-a*tions@github.com
          git fet*h origin
          git reset --har* origin/main
          git add mer*ed.xml.gz
          git commit -m *Auto update EPG" || exit 0
       *  git push origin HEAD:main
