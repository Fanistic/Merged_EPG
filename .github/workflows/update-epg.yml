name: Update EPG

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone XMLTV-EPG-Tools
        run: |
          git clone https://github.com/mikhoul/XMLTV-EPG-Tools.git

      - name: Install dependencies
        run: |
          pip install lxml requests pyyaml

      - name: Run merger
        run: |
          cp xmlmerge.yaml XMLTV-EPG-Tools/xmlmerge.yaml
          cd XMLTV-EPG-Tools
          python xmlmerge.py
          cp output/merged.xml.gz ../merged.xml.gz

      - name: Commit EPG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add merged.xml.gz
          git commit -m "Auto update EPG" || exit 0
          git push
